<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RegioFlow</title><style>*{box-sizing:border-box}body{background:#0b1115;color:#edf5f3;font:16px system-ui;margin:0}main{max-width:760px;margin:auto;padding:24px 18px 100px}h1{font-size:34px;letter-spacing:-2px;margin:0}em{color:#65f5ba;font-style:normal}small,p{color:#a4b7b8}.hero{background:linear-gradient(135deg,#1c493d,#102321);padding:26px;border-radius:26px;border:1px solid #31584a}.hero strong{display:block;font-size:42px;color:#65f5ba;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}article,form,.tile{background:#172128;border:1px solid #29383e;border-radius:20px;padding:18px;margin-bottom:10px}.tile strong{display:block;font-size:24px}button,input,select{font:inherit;background:#172128;color:inherit;border:1px solid #34474c;border-radius:12px;padding:12px}input,select{width:100%;margin:6px 0 14px}button{cursor:pointer}.primary{background:#65f5ba;color:#102b22;font-weight:bold;width:100%;border:0}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#111c23;padding:12px 0}nav button{border:0;font-size:13px}.line{display:flex;justify-content:space-between;gap:10px}.late{color:#ff9589}.ok{color:#65f5ba}article button{font-size:13px;margin:5px 5px 0 0}label{color:#b4c7c8}</style><main><h1>regio<em>flow.</em></h1><small>BUSINESS FINANCE</small><h2>Deine Finanzen.</h2><section id="home"><div class="hero"><small>Offene Forderungen</small><strong id="total"></strong><small id="count"></small></div><div class="grid"><div class="tile"><small>Zahlungseingänge</small><strong class="ok" id="paid"></strong></div><div class="tile"><small>Überfällig</small><strong class="late" id="late"></strong></div></div><button class="primary" onclick="fresh()">＋ Neue Rechnung</button><h2>Rechnungen</h2><input id="search" placeholder="Firma oder Rechnungsnummer suchen" oninput="render()"><select id="filter" onchange="render()"><option value="all">Alle</option><option value="open">Offen</option><option value="paid">Bezahlt</option><option value="late">Überfällig</option></select><div id="list"></div></section><section id="new" hidden><form id="entry"><h2>Rechnung erfassen</h2><label>Firma<input name="customer" list="options" required></label><datalist id="options"></datalist><label>Rechnungsnummer<input name="number" required></label><label>Rechnungsdatum<input name="date" type="date" required></label><label>Betrag (€)<input name="amount" type="number" min=".01" step=".01" required></label><label>Fällig am<input name="due" type="date" required></label><button class="primary">Speichern</button></form></section><section id="clients" hidden><h2>Kunden</h2><form id="cf"><label>Firma<input name="customer" required></label><button class="primary">Kunde speichern</button></form><div id="cl"></div></section><section id="dates" hidden><h2>Fälligkeiten</h2><div id="dl"></div></section><p>Lokale Speicherung in diesem Browser. Kein Cloud-Login. Kalender-Erinnerungen müssen importiert werden.</p><button onclick="download('regioflow.json',JSON.stringify(data),'application/json')">Datensicherung exportieren</button></main><nav><button onclick="show('home')">◈ Übersicht</button><button onclick="fresh()">＋ Neu</button><button onclick="show('clients')">♧ Kunden</button><button onclick="show('dates')">◷ Fristen</button></nav><script>const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('sv-SE'),money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n/100);let data;try{data=JSON.parse(localStorage.getItem('regioflow'))||{items:[],clients:[]}}catch{data={items:[],clients:[]}}let edit=null;function save(){localStorage.setItem('regioflow',JSON.stringify(data));render()}function show(id){document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==id);render()}function fresh(){edit=null;$('entry').reset();$('entry').elements.date.value=today();show('new')}function el(t,s,c){let e=document.createElement(t);e.textContent=s;if(c)e.className=c;return e}function btn(s,f){let b=el('button',s);b.onclick=f;return b}function card(i){let a=el('article',''),r=el('div','','line');r.append(el('b',i.customer),el('strong',money(i.amount)));a.append(r,el('p','RE '+i.number+' · Fällig '+i.due),el('p',i.paid?'Bezahlt':i.due<today()?'Überfällig':'Offen',i.paid?'ok':i.due<today()?'late':''),btn(i.paid?'Wieder öffnen':'Zahlung eingegangen',()=>{i.paid=!i.paid;save()}),btn('Bearbeiten',()=>{edit=i.id;let f=$('entry').elements;for(let k of ['customer','number','date','due'])f[k].value=i[k];f.amount.value=i.amount/100;show('new')}));if(!i.paid)a.append(btn('Kalender-Erinnerung',()=>calendar(i)));return a}function render(){let all=data.items,o=all.filter(i=>!i.paid),l=o.filter(i=>i.due<today()),sum=a=>money(a.reduce((s,i)=>s+i.amount,0));$('total').textContent=sum(o);$('paid').textContent=sum(all.filter(i=>i.paid));$('late').textContent=sum(l);$('count').textContent=o.length+' offene Rechnungen';let q=$('search').value.toLowerCase(),f=$('filter').value,rows=all.filter(i=>(i.customer+' '+i.number).toLowerCase().includes(q)&&(f==='all'||f==='open'&&!i.paid||f==='paid'&&i.paid||f==='late'&&!i.paid&&i.due<today()));$('list').replaceChildren(...rows.map(card));if(!rows.length)$('list').append(el('p','Keine Rechnungen vorhanden.'));$('dl').replaceChildren(...o.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(card));$('cl').replaceChildren(...data.clients.map(c=>{let a=el('article',c);a.append(btn('Rechnungen anzeigen',()=>{$('search').value=c;$('filter').value='all';show('home')}));return a}));$('options').replaceChildren(...data.clients.map(c=>{let e=document.createElement('option');e.value=c;return e}))}function client(c){if(!data.clients.includes(c))data.clients.push(c)}$('cf').onsubmit=e=>{e.preventDefault();let c=e.target.elements.customer.value.trim();if(c){client(c);save();e.target.reset()}};$('entry').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.customer=f.customer.trim();f.number=f.number.trim();if(!f.customer||!f.number)return;if(data.items.some(i=>i.id!==edit&&i.number===f.number)){alert('Rechnungsnummer bereits vorhanden');return}let old=data.items.find(i=>i.id===edit),i={...f,amount:Math.round(Number(f.amount)*100),id:edit||crypto.randomUUID(),paid:old?.paid||false};client(i.customer);if(old)data.items=data.items.map(x=>x.id===edit?i:x);else data.items.push(i);edit=null;save();show('home')};function download(n,s,t){let u=URL.createObjectURL(new Blob([s],{type:t})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function calendar(i){download('rechnung.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RegioFlow//DE','BEGIN:VEVENT','UID:'+i.id+'@regioflow','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z','DTSTART;VALUE=DATE:'+i.due.replaceAll('-',''),'SUMMARY:RegioFlow Rechnung faellig','BEGIN:VALARM','TRIGGER:-P3D','ACTION:DISPLAY','DESCRIPTION:Rechnung pruefen','END:VALARM','END:VEVENT','END:VCALENDAR',''].join('\r\n'),'text/calendar')}render()</script></html>
